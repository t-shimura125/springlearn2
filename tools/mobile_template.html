<title>springlearn2 ソースノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 通勤中に片手で読む。上部にファイル切替を固定、コードは行番号つきで横スクロール、質問は下から出るシート */
:root {
  --bg: #f1f3ef;
  --surface: #ffffff;
  --code-bg: #fbfcfa;
  --fg: #1d2420;
  --muted: #5f6b64;
  --line: #d6ddd6;
  --accent: #2c6a4c;
  --accent-soft: #e1eee6;
  --sel: #fff0c2;
  --sel-edge: #c98a00;
  --kw: #8a2f6b;
  --str: #2d6a1f;
  --com: #7a8580;
  --num: #a14e00;
  --type: #1f5c8a;
  --anno: #8a6d00;
  /* 差分の色: 追加=緑、変更=青、削除=赤(選択中の黄色と混ざらないように) */
  --add-bg: #e2f3e5; --add-edge: #2f8a4a;
  --chg-bg: #e4ecfa; --chg-edge: #3b6fc4;
  --del-bg: #fbe4e1; --del-edge: #c0392b;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-code: "BIZ UDGothic", "Osaka-Mono", "MS Gothic", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1a201c; --code-bg: #151a17; --fg: #e3ebe5; --muted: #98a59d; --line: #2c3530;
    --accent: #79c79c; --accent-soft: #1e3328; --sel: #3d3417; --sel-edge: #e2b13c;
    --kw: #e59ad0; --str: #9fd48a; --com: #7f8c85; --num: #f0b070; --type: #8cc3ee; --anno: #e3c766;
    --add-bg: #17361f; --add-edge: #5cc97f; --chg-bg: #1a2a44; --chg-edge: #7aa7f0; --del-bg: #3d1d1b; --del-edge: #f08a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1a201c; --code-bg: #151a17; --fg: #e3ebe5; --muted: #98a59d; --line: #2c3530;
  --accent: #79c79c; --accent-soft: #1e3328; --sel: #3d3417; --sel-edge: #e2b13c;
  --kw: #e59ad0; --str: #9fd48a; --com: #7f8c85; --num: #f0b070; --type: #8cc3ee; --anno: #e3c766;
  --add-bg: #17361f; --add-edge: #5cc97f; --chg-bg: #1a2a44; --chg-edge: #7aa7f0; --del-bg: #3d1d1b; --del-edge: #f08a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px; }
button, textarea, input { font: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 上部の固定バー */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 8px; border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.top h1 small { font-size: 12px; font-weight: 400; color: var(--muted); }
.tabs { display: flex; gap: 6px; margin-top: 8px; }
.tabs button { flex: none; font-size: 14px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.picker { margin-top: 8px; display: flex; gap: 8px; }
.picker button.file { flex: 1; min-width: 0; text-align: left; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: flex; gap: 8px; align-items: center; }
.picker .file .path { font-family: var(--font-code); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.picker .file .chev { margin-left: auto; color: var(--muted); flex: none; }
/* 版と比較元の選択 */
.vrow { margin-top: 6px; display: flex; gap: 6px; align-items: center; font-size: 13px; }
.vrow select { min-width: 0; flex: 1; font: inherit; font-size: 14px; color: var(--fg); padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.vrow .arrow { color: var(--muted); flex: none; }
.vmemo { margin-top: 4px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.vlist li { display: flex; gap: 8px; align-items: baseline; }
.vlist .vid { font-family: var(--font-code); font-weight: 700; flex: none; }
.vlist .vdate { color: var(--muted); font-size: 12px; flex: none; }
.vlist li.cur .vid { color: var(--accent); }
.dir h2.chg { color: var(--chg-edge); font-family: var(--font-body); font-weight: 700; }
/* 比較元 / 表示中の版 の切り替え */
.ver { flex: none; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.ver button { border: 0; background: none; padding: 6px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.ver button + button { border-left: 1px solid var(--line); }
.ver button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }

/* ファイル一覧 */
.files { margin-top: 10px; display: flex; flex-direction: column; gap: 14px; }
.files input { width: 100%; font-size: 16px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec + .sec { margin-top: 10px; padding-top: 14px; border-top: 2px solid var(--line); }
.sec > h3 { margin: 0; font-size: 14px; font-weight: 700; }
.sec > h3 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.dir h2 { margin: 0 0 4px; font-size: 12px; font-weight: 400; color: var(--muted); font-family: var(--font-code); letter-spacing: .02em; overflow-wrap: anywhere; }
.dir ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.dir li + li { border-top: 1px solid var(--line); }
.dir button { width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.dir button .name { font-family: var(--font-code); font-size: 14px; overflow-wrap: anywhere; min-width: 0; }
.dir button .role { margin-left: auto; font-size: 12px; color: var(--muted); flex: none; }
.dir button[aria-current="true"] { background: var(--accent-soft); font-weight: 700; }
.badge { flex: none; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; line-height: 1.6; border: 1px solid; }
.badge.mod { color: var(--chg-edge); background: var(--chg-bg); }
.badge.add { color: var(--add-edge); background: var(--add-bg); }
.badge.del { color: var(--del-edge); background: var(--del-bg); }
.dir button .name + .badge { margin-left: 2px; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.summary .counts { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.summary label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.summary label input { width: auto; }
.hit { font-size: 12px; color: var(--muted); font-family: var(--font-code); padding: 0 12px 8px; margin-top: -4px; overflow-wrap: anywhere; }
.hit mark { background: var(--sel); color: var(--fg); }

/* コード */
.filehead { margin: 14px 0 6px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.filehead .name { font-family: var(--font-code); font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.filehead .sub { font-size: 12px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; font-family: var(--font-code); font-size: 13px; line-height: 1.65; -webkit-text-size-adjust: 100%; }
.code table { border-collapse: collapse; min-width: 100%; }
.code td { padding: 0; vertical-align: top; }
.code .ln { position: sticky; left: 0; background: var(--code-bg); color: var(--muted); text-align: right; padding: 0 8px 0 6px; user-select: none; cursor: pointer; border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; min-width: 38px; }
.code .src { padding: 0 12px 0 10px; white-space: pre; tab-size: 4; -moz-tab-size: 4; }
.code tr.add .src, .code tr.add .ln { background: var(--add-bg); }
.code tr.add .ln { box-shadow: inset 3px 0 0 var(--add-edge); color: var(--add-edge); }
.code tr.chg .src, .code tr.chg .ln { background: var(--chg-bg); }
.code tr.chg .ln { box-shadow: inset 3px 0 0 var(--chg-edge); color: var(--chg-edge); }
.code tr.del .src, .code tr.del .ln { background: var(--del-bg); }
.code tr.del .ln { box-shadow: inset 3px 0 0 var(--del-edge); color: var(--del-edge); }
/* 改修後の表示で「この行の後ろ(上)で元の行が削除された」位置 */
.code tr.delbelow td { border-bottom: 2px dashed var(--del-edge); }
.code tr.delabove td { border-top: 2px dashed var(--del-edge); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border-left: 3px solid; }
.legend .sw.add { background: var(--add-bg); border-color: var(--add-edge); }
.legend .sw.chg { background: var(--chg-bg); border-color: var(--chg-edge); }
.legend .sw.del { background: var(--del-bg); border-color: var(--del-edge); }
.legend .dash { display: inline-block; width: 14px; border-top: 2px dashed var(--del-edge); vertical-align: middle; margin-right: 4px; }
.legend button { margin-left: auto; font-size: 12px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.absent { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 16px; font-size: 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.code tr:first-child td { padding-top: 8px; }
.code tr:last-child td { padding-bottom: 8px; }
.code tr.on .ln { background: var(--sel); color: var(--fg); font-weight: 700; box-shadow: inset 3px 0 0 var(--sel-edge); }
.code tr.on .src { background: var(--sel); }

/* ハイライト(highlight.js のクラス) */
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-selector-tag, .hljs-tag .hljs-name { color: var(--kw); }
.hljs-string, .hljs-attr .hljs-string, .hljs-selector-class { color: var(--str); }
.hljs-comment, .hljs-quote { color: var(--com); font-style: italic; }
.hljs-number { color: var(--num); }
.hljs-title, .hljs-type, .hljs-class .hljs-title, .hljs-attr, .hljs-attribute, .hljs-property { color: var(--type); }
.hljs-meta, .hljs-variable, .hljs-template-variable { color: var(--anno); }

/* 質問シート */
.askbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.askbar .in { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.askbar .ctx { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.askbar .ctx b { color: var(--fg); font-family: var(--font-code); font-weight: 400; overflow-wrap: anywhere; }
.askbar .ctx button { font-size: 12px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.askrow { display: flex; gap: 8px; align-items: flex-end; }
.askrow textarea { flex: 1; min-width: 0; resize: none; font-size: 16px; line-height: 1.5; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); max-height: 30vh; }
.btn { flex: none; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); font-weight: 700; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.noask { font-size: 13px; color: var(--muted); }

/* 回答・質問ログ */
.thread { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.turn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 0; }
.turn.q { background: var(--accent-soft); border-color: transparent; }
.turn .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.turn .q-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.md { overflow-wrap: anywhere; min-width: 0; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h3, .md h4 { font-size: 15px; margin: 14px 0 4px; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 1.4em; }
.md code { font-family: var(--font-code); font-size: 13px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; }
.md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-family: var(--font-code); font-size: 13px; line-height: 1.6; }
.md pre code { background: none; border: 0; padding: 0; }
.thinking { color: var(--muted); font-size: 13px; }
.err { color: var(--sel-edge); font-size: 13px; }
.log { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
details.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.entry > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
details.entry > summary::-webkit-details-marker { display: none; }
details.entry .meta { font-size: 12px; color: var(--muted); font-family: var(--font-code); overflow-wrap: anywhere; }
details.entry .first { overflow-wrap: anywhere; }
details.entry .body { padding: 0 14px 12px; border-top: 1px solid var(--line); }
details.entry .body .thread { margin-top: 10px; }
details.entry .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: 14px; padding: 16px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1><span id="appName">springlearn2</span><small id="built"></small></h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabCode" aria-selected="true">コード</button>
      <button role="tab" id="tabFiles" aria-selected="false">ファイル一覧</button>
      <button role="tab" id="tabLog" aria-selected="false">質問ログ <span id="logN"></span></button>
    </div>
    <div class="picker" id="picker">
      <button class="file" id="fileBtn"><span class="path" id="curPath"></span><span class="chev">▾</span></button>
      <div class="ver" role="group" aria-label="比較元と版のどちらを表示するか" id="sideSw">
        <button id="verOld" aria-pressed="false"></button>
        <button id="verNew" aria-pressed="true"></button>
      </div>
    </div>
    <div id="vbox">
      <div class="vrow">
        <select id="selBase" aria-label="比較元の版"></select>
        <span class="arrow">→</span>
        <select id="selVer" aria-label="表示する版"></select>
      </div>
      <div class="vmemo" id="vmemo"></div>
    </div>
  </header>

  <section id="viewCode">
    <div class="filehead"><span class="name" id="curName"></span><span class="sub" id="curSub"></span></div>
    <p class="hint">行番号をタップすると選択、もう1行タップで範囲選択。選んだ行について下の欄から質問できます(質問には表示中の版のコードが渡ります)。</p>
    <div class="legend" id="legend"></div>
    <div class="code" id="code"></div>
    <div class="thread" id="thread"></div>
  </section>

  <section id="viewFiles" hidden>
    <div class="files">
      <div class="summary" id="summary"></div>
      <input id="q" type="search" placeholder="ファイル名・コードを検索(例: PageableDefault)" autocomplete="off">
      <div id="tree" class="files"></div>
    </div>
  </section>

  <section id="viewLog" hidden>
    <div class="log" id="log"></div>
  </section>
</div>

<div class="askbar" id="askbar">
  <div class="in">
    <div class="ctx" id="ctx"></div>
    <div class="askrow" id="askrow">
      <textarea id="askText" rows="1" placeholder="このコードについて質問する"></textarea>
      <button class="btn" id="askBtn">質問</button>
    </div>
    <div class="noask" id="noask" hidden></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/groovy.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const files = DATA.files;
const VERS = DATA.versions;                          // 古い順 [{id, date, desc, memo, dir}]
const VI = Object.fromEntries(VERS.map((v, i) => [v.id, i]));
const VM = Object.fromEntries(VERS.map(v => [v.id, v]));
const latest = VERS[VERS.length - 1].id;
// 質問ログに残るパス(各版の「フォルダ/…」)からファイルを引く。キーでも引ける
const byPath = {};
for (const f of files) { byPath[f.key] = f; for (const a of Object.values(f.at)) if (!byPath[a.path]) byPath[a.path] = f; }
// 比較機能を入れる前の質問ログ(ver が old/new)は v0 / v1 への質問
const LEGACY = { old: 'v0', new: 'v1' };

let tgt = VM[store.get('tgt')] ? store.get('tgt') : latest;             // 表示する版
let base = store.get('base');                                            // 比較元('' = 比較しない)
if (base !== '' && !(VM[base] && VI[base] < VI[tgt])) base = VI[tgt] > 0 ? VERS[VI[tgt] - 1].id : '';
let onBase = store.get('side') === 'base' && !!base;                    // 比較元の側を表示中か
const shown = () => (onBase && base ? base : tgt);
let cur = byPath[store.get('file')] || files.find(f => f.main) || files[0];
let sel = null;          // {from, to} 1始まり
let thread = null;       // 現在の会話 {id, file, key, ver, tgt, base, lines, turns:[{q,a}]}
let sample = null, db = null, ctl = null;
let onlyChanged = store.get('onlyChanged') === '1';
const STATUS = { mod: '変更', add: '追加', del: '削除', same: '変更なし' };
const vlabel = id => VM[id] ? `${id}(${VM[id].desc})` : id;
const at = (f, v = shown()) => f.at[v] || null;                          // その版のファイル {path, name, b}
const textOf = a => (a && a.b != null ? DATA.blobs[a.b] : null);
const anyAt = f => at(f) || at(f, tgt) || (base && at(f, base)) || Object.values(f.at).pop();
const inPair = f => !!(at(f, tgt) || (base && at(f, base)));
const res = f => (base ? (DATA.pairs[base + '|' + tgt] || {})[f.key] : null);   // 比較元→版の差分(変更なしは null)
const status = f => (f.doc ? 'same' : (res(f) || { st: 'same' }).st);

$('built').textContent = '生成 ' + DATA.built;

/* ---------- 版・比較元の選択 ---------- */
function renderVerUi() {
  $('selVer').innerHTML = VERS.map(v => `<option value="${v.id}"${v.id === tgt ? ' selected' : ''}>${esc(vlabel(v.id))}${v.id === latest ? ' 最新' : ''}</option>`).join('');
  $('selBase').innerHTML = VERS.filter(v => VI[v.id] < VI[tgt]).map(v => `<option value="${v.id}"${v.id === base ? ' selected' : ''}>比較元 ${esc(v.id)}</option>`).join('')
    + `<option value=""${base ? '' : ' selected'}>比較しない</option>`;
  $('sideSw').hidden = !base;
  $('verOld').textContent = base ? base : '';
  $('verNew').textContent = tgt;
  $('verOld').title = base ? '比較元 ' + vlabel(base) : '';
  $('verNew').title = vlabel(tgt);
  $('verOld').setAttribute('aria-pressed', String(onBase));

/* ---------- Markdown(回答表示用の最小限) ---------- */
function inline(s) {

    if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; }
    if (list) { html += `</${list}>`; list = null; }
  };
  while (i < lines.length) {
    const l = lines[i];
    const fence = l.match(/^```\s*(\w*)/);
    if (fence) {
      flush();
      const body = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) body.push(lines[i++]);
      i++;
      html += `<pre><code>${highlight(body.join('\n'), fence[1] === 'html' ? 'xml' : fence[1])}</code></pre>`;
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    const ul = l.match(/^\s*[-*]\s+(.*)/);
    const ol = l.match(/^\s*\d+[.)]\s+(.*)/);

    else if (ul || ol) {

      const want = ul ? 'ul' : 'ol';

                 verLabel: vlabel(t.ver), lines: t.lines, turns: t.turns, updated: Date.now() };
  try {
    if (t.id) await db.collection('qa').doc(t.id).set({ ...body, created: t.created });
    else { t.created = Date.now(); const ref = await db.collection('qa').add({ ...body, created: t.created }); t.id = ref.id; }
  } catch (e) {
    $('thread').insertAdjacentHTML('beforeend', '<p class="err">質問ログに保存できませんでした(回答はこの画面には残っています)。</p>');
  }
}
function fmt(ms) { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }
// 質問ログの1件から {ver, tgt, base} を読む(比較機能を入れる前の ver: old/new にも対応)
function logVers(x) {
  if (x.ver && VM[x.ver] !== undefined && !LEGACY[x.ver]) return { ver: x.ver, tgt: x.tgt || x.ver, base: x.base || '' };
  const ver = LEGACY[x.ver] || 'v0';
  return { ver, tgt: 'v1', base: 'v0' };
}
function renderLog() {
  const log = $('log');
  $('logN').textContent = logDocs.length ? `(${logDocs.length})` : '';
  if (!logDocs.length) { log.innerHTML = '<p class="empty">まだ質問はありません。コード画面の下の欄から質問すると、ここに残ります。</p>'; return; }
  log.innerHTML = '';
  for (const d of logDocs) {
    const x = d.data();
    const lv = logVers(x);
    const f = byPath[x.key] || byPath[x.file];
    const canOpen = f && VM[lv.ver] && f.at[lv.ver] && VM[lv.tgt];
    const det = document.createElement('details');
    det.className = 'entry';
    const cmp = x.cmp ? ` ・ 比較 ${x.cmp}` : '';
    det.innerHTML = `<summary><span class="meta">${esc(fmt(x.updated || x.created))} ・ ${esc(lv.ver)}${esc(cmp)} ・ ${esc(x.file)} ${esc(linesLabel(x.lines))}</span><span class="first">${esc(x.turns && x.turns[0] ? x.turns[0].q : '')}</span></summary><div class="body"><div class="thread"></div><div class="acts">${canOpen ? '<button class="btn ghost">このコードを開いて続けて質問</button>' : `<span class="noask">この版(${esc(lv.ver)})はノートから外れたため開けません(git には残っています)。</span>`}</div></div>`;
    det.addEventListener('toggle', () => { if (det.open) renderThread(det.querySelector('.thread'), x); }, { once: true });
    const btn = det.querySelector('.btn');
    if (btn) btn.onclick = () => {
      if (ctl) return;
      setVers(lv.tgt, lv.base, lv.ver !== lv.tgt);
      renderSummary();
      open(f);
      if (x.lines) $('code').querySelectorAll('tr').forEach(tr => { const k = +tr.dataset.n; tr.classList.toggle('on', k >= x.lines.from && k <= x.lines.to); });
      sel = x.lines || null;
      thread = { id: d.id, created: x.created, file: x.file, key: f.key, ver: lv.ver, tgt: lv.tgt, base: lv.base, lines: x.lines || null, turns: x.turns.slice() };
      renderThread($('thread'), thread);
      renderCtx();
      show('tabCode');
    };
    log.appendChild(det);
  }
}

/* ---------- 起動 ---------- */
renderVerUi();
if (!inPair(cur) && !cur.doc) cur = files.find(f => f.main && inPair(f)) || files.find(inPair);
renderSummary();
open(cur);
renderLog();
$('log').innerHTML = '<p class="empty">質問ログを読み込み中…</p>';
(async () => {
  if (!window.claude) { disableAsk(); $('log').innerHTML = '<p class="empty">質問ログは claude.ai 上で開いたときに表示されます。</p>'; return; }
  claude.use('sample').then(s => { sample = s; if (!s) disableAsk(); });
  db = await claude.use('db');
  if (!db) { $('log').innerHTML = '<p class="empty">質問ログは claude.ai にサインインして開いたときに表示されます。</p>'; return; }
  const timer = setTimeout(() => { if (!logDocs.length) $('log').innerHTML = '<p class="empty">質問ログにまだ接続できません。電波の良い場所で開き直してください。</p>'; }, 10000);
  db.collection('qa').orderBy('updated', 'desc').limit(300).onSnapshot(snap => {
    if (!snap.fromCache) clearTimeout(timer);
    logDocs = snap.docs;
    renderLog();
  }, () => { clearTimeout(timer); $('log').innerHTML = '<p class="empty">質問ログを読み込めませんでした。</p>'; });
})();
</script>

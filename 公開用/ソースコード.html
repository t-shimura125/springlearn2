  else if (sel.from === sel.to && n !== sel.from) sel = { from: Math.min(sel.from, n), to: Math.max(sel.from, n) };
  else if (n >= sel.from && n <= sel.to) sel = null;

  for (const tr of $('code').querySelectorAll('tr')) {

});
function linesLabel(s) { return s ? (s.from === s.to ? `${s.from}行目` : `${s.from}〜${s.to}行目`) : 'ファイル全体'; }
const canAsk = () => textOf(at(cur)) != null;
function renderCtx() {

/* ---------- Markdown(回答表示用の最小限) ---------- */
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function md(src) {
  const lines = src.split('\n');
  let html = '', i = 0, list = null, para = [];
  const flush = () => {
    if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; }
    if (list) { html += `</${list}>`; list = null; }
  };
  while (i < lines.length) {
    const l = lines[i];
    const fence = l.match(/^```\s*(\w*)/);
    if (fence) {
      flush();
      const body = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) body.push(lines[i++]);
      i++;
      html += `<pre><code>${highlight(body.join('\n'), fence[1] === 'html' ? 'xml' : fence[1])}</code></pre>`;
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    const ul = l.match(/^\s*[-*]\s+(.*)/);
    const ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { flush(); html += `<h4>${inline(h[2])}</h4>`; }
    else if (ul || ol) {
      if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; }
      const want = ul ? 'ul' : 'ol';
      if (list !== want) { if (list) html += `</${list}>`; html += `<${want}>`; list = want; }
      html += `<li>${inline((ul || ol)[1])}</li>`;
    }
    else if (!l.trim()) flush();
    else { if (list) { html += `</${list}>`; list = null; } para.push(l); }
    i++;
  }
  flush();
  return html;
}

/* ---------- 質問 ---------- */
function numbered(text, s) {
  const ls = text.split('\n');
  const from = s ? s.from : 1, to = s ? s.to : ls.length;
  return ls.slice(from - 1, to).map((l, k) => `${from + k}: ${l}`).join('\n');
}
// 質問に渡すコードは、その会話の版(t.ver)に合わせる。差分は t.base → t.tgt
function buildPrompt(t, question) {
  const f = byPath[t.key] || byPath[t.file] || cur;
  const v = t.ver, a = f.at[v] || anyAt(f), text = textOf(a) || '';
  const pr = t.base ? DATA.pairs[t.base + '|' + t.tgt] || {} : null;
  const r = pr ? pr[f.key] : null;
  const verList = VERS.map(x => `- ${x.id}(${x.date}、${x.desc}): ${x.memo}`).join('\n');
  let fileDiff;
  if (pr) fileDiff = `## このファイルの差分(${vlabel(t.base)} → ${vlabel(t.tgt)}。空白だけの違いは除く)\n${r ? r.diff : '変更なし'}`;
  else if (v === VERS[0].id && DATA.before && DATA.prev && DATA.prev[f.key]) fileDiff = `## このファイルの、前の版(${DATA.before.id})からの差分\n${DATA.prev[f.key].diff}`;
  else fileDiff = '## 差分\n(比較なしで表示中)';
  const changed = pr ? Object.entries(pr).map(([k, x]) => `- ${(byPath[k] && anyAt(byPath[k]).path) || k}(${STATUS[x.st]})`).join('\n') || '(なし)' : '(比較なし)';
  const others = files.filter(x => x !== f && textOf(x.at[v]) != null).map(x => `### ${x.at[v].path}\n${textOf(x.at[v])}`).join('\n\n');
  const rules = `${DATA.guide}

# ノートに入っている版
${verList}

# 今回の質問の対象
表示中の版: ${vlabel(v)}${t.base ? `(比較: ${t.base} → ${t.tgt})` : ''}
ファイル: ${a.path}
範囲: ${linesLabel(t.lines)}
${t.lines ? '\n## 選択された行\n' + numbered(text, t.lines) + '\n' : ''}
## 対象ファイル全体(行番号つき)
${numbered(text, null)}

${fileDiff}

# 比較元から変わったファイルの一覧
${changed}

# 参考: 同じ版(${v})の他のファイル
${others}`;
  const turns = [{ role: 'user', content: rules + '\n\n# 質問\n' + (t.turns[0] ? t.turns[0].q : question) }];
  t.turns.forEach((x, k) => {
    if (k > 0) turns.push({ role: 'user', content: x.q });
    if (x.a) turns.push({ role: 'assistant', content: x.a });
  });
  if (t.turns.length) turns.push({ role: 'user', content: question });
  return turns;
}
function renderThread(el, t, pendingQ, pendingA) {
  let h = '';
  for (const x of t.turns) {
    h += `<div class="turn q"><div class="who">質問</div><div class="q-text">${esc(x.q)}</div></div>`;
    h += `<div class="turn"><div class="who">Claude</div><div class="md">${md(x.a)}</div></div>`;
  }
  if (pendingQ != null) {
    h += `<div class="turn q"><div class="who">質問</div><div class="q-text">${esc(pendingQ)}</div></div>`;
    h += `<div class="turn"><div class="who">Claude</div><div class="md">${pendingA ? md(pendingA) : '<span class="thinking">考え中…(数十秒かかることがあります)</span>'}</div></div>`;
  }
  el.innerHTML = h;
}
const ERR = {
  not_granted: 'Claude への質問が許可されていません。',
  rate_limited: '質問が続いたため一時的に止められました。少し待ってからもう一度送ってください。',
  cancelled: '止めました。',
};
async function ask() {
  const q = $('askText').value.trim();
  if (!q || !sample || !canAsk()) return;
  if (!thread) thread = { id: null, file: at(cur).path, key: cur.key, ver: shown(), tgt, base, lines: sel, turns: [] };
  const t = thread;
  const input = buildPrompt(t, q);
  $('askText').value = ''; autosize();
  $('askBtn').textContent = '停止';
  ctl = new AbortController();
  const el = $('thread');
  renderThread(el, t, q, '');
  el.lastElementChild.scrollIntoView({ block: 'nearest' });
  try {
    const { text } = await sample(input, { signal: ctl.signal, cache: false, onText: ({ text }) => renderThread(el, t, q, text) });
    t.turns.push({ q, a: text });
    renderThread(el, t);
    saveThread(t);
  } catch (e) {
    renderThread(el, t, q, e.text || '');
    el.insertAdjacentHTML('beforeend', `<p class="err">${esc(ERR[e.code] || 'うまく回答を受け取れませんでした。もう一度送ってください。')}</p>`);
    if (e.text) { t.turns.push({ q, a: e.text + '\n\n(途中で止まりました)' }); saveThread(t); }
    if (e.code === 'not_granted') disableAsk();
  } finally {
    ctl = null;
    $('askBtn').textContent = '質問';
    renderCtx();
  }
}
$('askBtn').onclick = () => { if (ctl) ctl.abort(); else ask(); };
function autosize() { const a = $('askText'); a.style.height = 'auto'; a.style.height = Math.min(a.scrollHeight, window.innerHeight * 0.3) + 'px'; }
$('askText').addEventListener('input', autosize);
function disableAsk() {
  $('askrow').hidden = true;
  $('noask').hidden = false;
  $('noask').textContent = 'ここでは Claude に質問できません。claude.ai のアプリでこのページを開くと質問できます。';
}

/* ---------- 質問ログ(db) ---------- */
let logDocs = [];
async function saveThread(t) {
  if (!db) return;
  // ver: 質問した版、cmp: そのときの比較(比較元→版)、verLabel: 読みやすい版名
  const body = { file: t.file, key: t.key, ver: t.ver, tgt: t.tgt, base: t.base || '', cmp: t.base ? `${t.base}→${t.tgt}` : '',
                 verLabel: vlabel(t.ver), lines: t.lines, turns: t.turns, updated: Date.now() };
  try {
    if (t.id) await db.collection('qa').doc(t.id).set({ ...body, created: t.created });
    else { t.created = Date.now(); const ref = await db.collection('qa').add({ ...body, created: t.created }); t.id = ref.id; }
  } catch (e) {
    $('thread').insertAdjacentHTML('beforeend', '<p class="err">質問ログに保存できませんでした(回答はこの画面には残っています)。</p>');
  }
}
function fmt(ms) { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }
// 質問ログの1件から {ver, tgt, base} を読む(比較機能を入れる前の ver: old/new にも対応)
function logVers(x) {
  if (x.ver && VM[x.ver] !== undefined && !LEGACY[x.ver]) return { ver: x.ver, tgt: x.tgt || x.ver, base: x.base || '' };
  const ver = LEGACY[x.ver] || 'v0';
  return { ver, tgt: 'v1', base: 'v0' };
}
function renderLog() {
  const log = $('log');
  $('logN').textContent = logDocs.length ? `(${logDocs.length})` : '';
  if (!logDocs.length) { log.innerHTML = '<p class="empty">まだ質問はありません。コード画面の下の欄から質問すると、ここに残ります。</p>'; return; }
  log.innerHTML = '';
  for (const d of logDocs) {
    const x = d.data();
    const lv = logVers(x);
    const f = byPath[x.key] || byPath[x.file];
    const canOpen = f && VM[lv.ver] && f.at[lv.ver] && VM[lv.tgt];
    const det = document.createElement('details');
    det.className = 'entry';
    const cmp = x.cmp ? ` ・ 比較 ${x.cmp}` : '';
    det.innerHTML = `<summary><span class="meta">${esc(fmt(x.updated || x.created))} ・ ${esc(lv.ver)}${esc(cmp)} ・ ${esc(x.file)} ${esc(linesLabel(x.lines))}</span><span class="first">${esc(x.turns && x.turns[0] ? x.turns[0].q : '')}</span></summary><div class="body"><div class="thread"></div><div class="acts">${canOpen ? '<button class="btn ghost">このコードを開いて続けて質問</button>' : `<span class="noask">この版(${esc(lv.ver)})はノートから外れたため開けません(git には残っています)。</span>`}</div></div>`;
    det.addEventListener('toggle', () => { if (det.open) renderThread(det.querySelector('.thread'), x); }, { once: true });
    const btn = det.querySelector('.btn');
    if (btn) btn.onclick = () => {
      if (ctl) return;
      setVers(lv.tgt, lv.base, lv.ver !== lv.tgt);
      renderSummary();
      open(f);
      if (x.lines) $('code').querySelectorAll('tr').forEach(tr => { const k = +tr.dataset.n; tr.classList.toggle('on', k >= x.lines.from && k <= x.lines.to); });
      sel = x.lines || null;
      thread = { id: d.id, created: x.created, file: x.file, key: f.key, ver: lv.ver, tgt: lv.tgt, base: lv.base, lines: x.lines || null, turns: x.turns.slice() };
      renderThread($('thread'), thread);
      renderCtx();
      show('tabCode');
    };
    log.appendChild(det);
  }
}

/* ---------- 起動 ---------- */
renderVerUi();
if (!inPair(cur) && !cur.doc) cur = files.find(f => f.main && inPair(f)) || files.find(inPair);
renderSummary();
open(cur);
renderLog();
$('log').innerHTML = '<p class="empty">質問ログを読み込み中…</p>';
(async () => {
  if (!window.claude) { disableAsk(); $('log').innerHTML = '<p class="empty">質問ログは claude.ai 上で開いたときに表示されます。</p>'; return; }
  claude.use('sample').then(s => { sample = s; if (!s) disableAsk(); });
  db = await claude.use('db');
  if (!db) { $('log').innerHTML = '<p class="empty">質問ログは claude.ai にサインインして開いたときに表示されます。</p>'; return; }
  const timer = setTimeout(() => { if (!logDocs.length) $('log').innerHTML = '<p class="empty">質問ログにまだ接続できません。電波の良い場所で開き直してください。</p>'; }, 10000);
  db.collection('qa').orderBy('updated', 'desc').limit(300).onSnapshot(snap => {
    if (!snap.fromCache) clearTimeout(timer);
    logDocs = snap.docs;
    renderLog();
  }, () => { clearTimeout(timer); $('log').innerHTML = '<p class="empty">質問ログを読み込めませんでした。</p>'; });
})();
</script>

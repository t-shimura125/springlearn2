<title>springlearn2 ソースノート</title>

<style>
/* 通勤中に片手で読む。上部にファイル切替を固定、コードは行番号つきで横スクロール、質問は下から出るシート */
:root {
  --bg: #f1f3ef;
  --surface: #ffffff;
  --code-bg: #fbfcfa;
  --fg: #1d2420;
  --muted: #5f6b64;
  --line: #d6ddd6;
  --accent: #2c6a4c;
  --accent-soft: #e1eee6;
  --sel: #fff0c2;
  --sel-edge: #c98a00;
  --kw: #8a2f6b;
  --str: #2d6a1f;
  --com: #7a8580;
  --num: #a14e00;
  --type: #1f5c8a;
  --anno: #8a6d00;
  /* 差分の色: 追加=緑、変更=青、削除=赤(選択中の黄色と混ざらないように) */
  --add-bg: #e2f3e5; --add-edge: #2f8a4a;
  --chg-bg: #e4ecfa; --chg-edge: #3b6fc4;
  --del-bg: #fbe4e1; --del-edge: #c0392b;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-code: "BIZ UDGothic", "Osaka-Mono", "MS Gothic", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1a201c; --code-bg: #151a17; --fg: #e3ebe5; --muted: #98a59d; --line: #2c3530;
    --accent: #79c79c; --accent-soft: #1e3328; --sel: #3d3417; --sel-edge: #e2b13c;
    --kw: #e59ad0; --str: #9fd48a; --com: #7f8c85; --num: #f0b070; --type: #8cc3ee; --anno: #e3c766;
    --add-bg: #17361f; --add-edge: #5cc97f; --chg-bg: #1a2a44; --chg-edge: #7aa7f0; --del-bg: #3d1d1b; --del-edge: #f08a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1a201c; --code-bg: #151a17; --fg: #e3ebe5; --muted: #98a59d; --line: #2c3530;
  --accent: #79c79c; --accent-soft: #1e3328; --sel: #3d3417; --sel-edge: #e2b13c;
  --kw: #e59ad0; --str: #9fd48a; --com: #7f8c85; --num: #f0b070; --type: #8cc3ee; --anno: #e3c766;
  --add-bg: #17361f; --add-edge: #5cc97f; --chg-bg: #1a2a44; --chg-edge: #7aa7f0; --del-bg: #3d1d1b; --del-edge: #f08a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px; }
button, textarea, input { font: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 上部の固定バー */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 8px; border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.top h1 small { font-size: 12px; font-weight: 400; color: var(--muted); }
.tabs { display: flex; gap: 6px; margin-top: 8px; }
.tabs button { flex: none; font-size: 14px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.picker { margin-top: 8px; display: flex; gap: 8px; }
.picker button.file { flex: 1; min-width: 0; text-align: left; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: flex; gap: 8px; align-items: center; }
.picker .file .path { font-family: var(--font-code); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.picker .file .chev { margin-left: auto; color: var(--muted); flex: none; }
/* 元 / 改修後 の切り替え */
.ver { flex: none; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.ver button { border: 0; background: none; padding: 6px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.ver button + button { border-left: 1px solid var(--line); }
.ver button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }

/* ファイル一覧 */
.files { margin-top: 10px; display: flex; flex-direction: column; gap: 14px; }
.files input { width: 100%; font-size: 16px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec + .sec { margin-top: 10px; padding-top: 14px; border-top: 2px solid var(--line); }
.sec > h3 { margin: 0; font-size: 14px; font-weight: 700; }
.sec > h3 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.dir h2 { margin: 0 0 4px; font-size: 12px; font-weight: 400; color: var(--muted); font-family: var(--font-code); letter-spacing: .02em; overflow-wrap: anywhere; }
.dir ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.dir li + li { border-top: 1px solid var(--line); }
.dir button { width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.dir button .name { font-family: var(--font-code); font-size: 14px; overflow-wrap: anywhere; min-width: 0; }
.dir button .role { margin-left: auto; font-size: 12px; color: var(--muted); flex: none; }
.dir button[aria-current="true"] { background: var(--accent-soft); font-weight: 700; }
.badge { flex: none; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; line-height: 1.6; border: 1px solid; }
.badge.mod { color: var(--chg-edge); background: var(--chg-bg); }
.badge.add { color: var(--add-edge); background: var(--add-bg); }
.badge.del { color: var(--del-edge); background: var(--del-bg); }
.dir button .name + .badge { margin-left: 2px; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.summary .counts { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.summary label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.summary label input { width: auto; }
.hit { font-size: 12px; color: var(--muted); font-family: var(--font-code); padding: 0 12px 8px; margin-top: -4px; overflow-wrap: anywhere; }
.hit mark { background: var(--sel); color: var(--fg); }

/* コード */
.filehead { margin: 14px 0 6px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.filehead .name { font-family: var(--font-code); font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.filehead .sub { font-size: 12px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; font-family: var(--font-code); font-size: 13px; line-height: 1.65; -webkit-text-size-adjust: 100%; }
.code table { border-collapse: collapse; min-width: 100%; }
.code td { padding: 0; vertical-align: top; }
.code .ln { position: sticky; left: 0; background: var(--code-bg); color: var(--muted); text-align: right; padding: 0 8px 0 6px; user-select: none; cursor: pointer; border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; min-width: 38px; }
.code .src { padding: 0 12px 0 10px; white-space: pre; tab-size: 4; -moz-tab-size: 4; }
.code tr.add .src, .code tr.add .ln { background: var(--add-bg); }
.code tr.add .ln { box-shadow: inset 3px 0 0 var(--add-edge); color: var(--add-edge); }
.code tr.chg .src, .code tr.chg .ln { background: var(--chg-bg); }
.code tr.chg .ln { box-shadow: inset 3px 0 0 var(--chg-edge); color: var(--chg-edge); }
.code tr.del .src, .code tr.del .ln { background: var(--del-bg); }
.code tr.del .ln { box-shadow: inset 3px 0 0 var(--del-edge); color: var(--del-edge); }
/* 改修後の表示で「この行の後ろ(上)で元の行が削除された」位置 */
.code tr.delbelow td { border-bottom: 2px dashed var(--del-edge); }
.code tr.delabove td { border-top: 2px dashed var(--del-edge); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border-left: 3px solid; }
.legend .sw.add { background: var(--add-bg); border-color: var(--add-edge); }
.legend .sw.chg { background: var(--chg-bg); border-color: var(--chg-edge); }
.legend .sw.del { background: var(--del-bg); border-color: var(--del-edge); }
.legend .dash { display: inline-block; width: 14px; border-top: 2px dashed var(--del-edge); vertical-align: middle; margin-right: 4px; }
.legend button { margin-left: auto; font-size: 12px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.absent { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 16px; font-size: 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.code tr:first-child td { padding-top: 8px; }
.code tr:last-child td { padding-bottom: 8px; }
.code tr.on .ln { background: var(--sel); color: var(--fg); font-weight: 700; box-shadow: inset 3px 0 0 var(--sel-edge); }
.code tr.on .src { background: var(--sel); }

/* ハイライト(highlight.js のクラス) */
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-selector-tag, .hljs-tag .hljs-name { color: var(--kw); }
.hljs-string, .hljs-attr .hljs-string, .hljs-selector-class { color: var(--str); }
.hljs-comment, .hljs-quote { color: var(--com); font-style: italic; }
.hljs-number { color: var(--num); }
.hljs-title, .hljs-type, .hljs-class .hljs-title, .hljs-attr, .hljs-attribute, .hljs-property { color: var(--type); }
.hljs-meta, .hljs-variable, .hljs-template-variable { color: var(--anno); }

/* 質問シート */
.askbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.askbar .in { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.askbar .ctx { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.askbar .ctx b { color: var(--fg); font-family: var(--font-code); font-weight: 400; overflow-wrap: anywhere; }
.askbar .ctx button { font-size: 12px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.askrow { display: flex; gap: 8px; align-items: flex-end; }
.askrow textarea { flex: 1; min-width: 0; resize: none; font-size: 16px; line-height: 1.5; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); max-height: 30vh; }
.btn { flex: none; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); font-weight: 700; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.noask { font-size: 13px; color: var(--muted); }

/* 回答・質問ログ */
.thread { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.turn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 0; }
.turn.q { background: var(--accent-soft); border-color: transparent; }
.turn .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.turn .q-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.md { overflow-wrap: anywhere; min-width: 0; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h3, .md h4 { font-size: 15px; margin: 14px 0 4px; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 1.4em; }
.md code { font-family: var(--font-code); font-size: 13px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; }
.md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-family: var(--font-code); font-size: 13px; line-height: 1.6; }
.md pre code { background: none; border: 0; padding: 0; }
.thinking { color: var(--muted); font-size: 13px; }
.err { color: var(--sel-edge); font-size: 13px; }
.log { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
details.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.entry > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
details.entry > summary::-webkit-details-marker { display: none; }
details.entry .meta { font-size: 12px; color: var(--muted); font-family: var(--font-code); overflow-wrap: anywhere; }
details.entry .first { overflow-wrap: anywhere; }
details.entry .body { padding: 0 14px 12px; border-top: 1px solid var(--line); }
details.entry .body .thread { margin-top: 10px; }
details.entry .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: 14px; padding: 16px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1><span id="appName">springlearn2</span><small id="built"></small></h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabCode" aria-selected="true">コード</button>
      <button role="tab" id="tabFiles" aria-selected="false">ファイル一覧</button>

</div>

</div>

const DATA = {"built": "2026/11/24 22:54", "guide": "あなたは Spring Boot を学習中の人の先生です。参考書のサンプルコード(下に全文あり)を読みながら、通勤中にスマホで質問しています。日本語で答えてください。\n\n# 学習者\n- Java Silver 取得済み(実務経験は浅い)。本番案件は Java(Spring Boot)+ TypeScript\n- 前シーズンで Controller / Repository / Thymeleaf / JPA の基本、検索・ページングまで写経済み\n- いまは参考書の「元」の版(7章 todolist7x)と「改修後」の版(8章 todolist8b)を見比べて、何が変わったかを学んでいる\n\n# 答え方\n- コードを丸ごと書き直して見せるのではなく、まず「なぜそうなるか」を説明する\n- 抽象的な仕組み(DI、プロキシ、セッションなど)は身近なたとえ話で噛み砕いてから、コードの該当行に戻って説明する\n- コードに触れるときは「TodoListController.java の 40行目」のようにファイル名と行番号で示す(行番号は、いま表示している版のもの)\n- 元と改修後の違いに関する質問なら、下の「元からの差分」を使って、どこがどう変わったかを示す\n- 1度に新しい概念を詰め込みすぎない。スマホで読むので、見出しと短い段落・箇条書きで簡潔に\n- 下に載っているコードに無いことを推測で断定しない。分からないことは分からないと言う", "versions": {"old": {"label": "元", "desc": "7章 todolist7x"}, "new": {"label": "改修後", "desc": "8章 todolist8b"}}, "files": [{"id": "todolist7x/src/main/java/com/example/todolist/common/Utils.java", "dir": "java/com/example/todolist/common", "sec": "main", "role": "共通処理", "lang": "java", "main": false, "old": {"path": "todolist7x/src/main/java/com/example/todolist/common/Utils.java", "name": "Utils.java", "text": "package com.example.todolist.common;\n\nimport java.time.DateTimeException;\nimport java.time.LocalDate;\nimport java.time.format.DateTimeFormatter;\n\npublic class Utils {\n\n    private static final DateTimeFormatter FORMATTER = DateTimeFormatter.ofPattern(\"yyyy-MM-dd\");\n\n    /**\n     * 文字列をyyyy-MM-dd型の日付としてjava.time.LocalDateオブジェクトへ変換する。<br>\n     * \n     * @param s 変換対象\n     * @return 変換結果(引数がnull, \"\", yyyy-MM-dd形式でなければnullを返す)\n     */\n    public static LocalDate str2date(String s) {\n        if (s == null || s.equals(\"\")) {\n            return null;\n        }\n        try {\n            return LocalDate.parse(s, FORMATTER);\n        } catch (DateTimeException e) {\n            e.printStackTrace();\n            return null;\n        }\n    }\n\n    /**\n     * 文字列をyyyy-MM-dd型の日付としてjava.time.LocalDateオブジェクトへ変換する。<br>\n     * \n     * @param s 変換対象\n     * @return 変換 on.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.servlet.ModelAndView;\n\nimport com.example.todolist.dao.TodoDao;\nimport com.example.todolist.entity.Todo;\nimport com.example.todolist.form.TodoData;\nimport com.example.todolist.form.TodoQuery;\nimport com.example.todolist.repository.TodoRepository;\nimport com.example.todolist.service.TodoService;\n\nimport lombok.RequiredArgsConstructor;\n\n@Controller\n@RequiredArgsConstructor\npublic class TodoListController {\n    private final TodoRepository todoRepository;\n    private final TodoService todoService;\n    private final HttpSession session;\n    private final TodoDao todoDao;\n\n    //  Todo一覧表示\n    @GetMapping(\"/todo\")\n    public ModelAndView showTodoList(ModelAndView mv,\n            @PageableDefault(page = 0, size = 5, sort = \"id\") Pageable pageable) {\n        //sessionから前回の検索条件を取得\n        TodoQuery todoQuery = (TodoQuery) session.getAttribute(\"todoQuery\");\n        if (todoQuery == null) {\n            //なければ初期値を使う\n            todoQuery = new TodoQuery();\n            //セッションへ保存\n            session.setAttribute(\"todoQuery\", todoQuery);\n        }\n\n        //sessionから前回のpageableを取得\n        Pageable prevPageable = (Pageable) session.getAttribute(\"prevPageable\");\n        if (prevPageable == null) {\n            //なければ@PageableDefaultを使う\n            prevPageable = pageable;\n            //セッションへ保存\n            session.setAttribute(\"prevPageable\", prevPageable);\n        }\n        mv.setViewName(\"todoList\");\n        Page<Todo> todoPage = todoDao.findByCriteria(todoQuery, prevPageable);\n        mv.addObject(\"todoQuery\", todoQuery);\n        mv.addObject(\"todoPage\", todoPage);\n        mv.addObject(\"todoList\", todoPage.getContent());\n        return mv;\n    }\n\n    //  ToDo一覧画面(todoList.html)で[検索]ボタンが押された時の処理\n    @GetMapping(\"/todo/query\")\n    public ModelAndView queryTodo(@ModelAttribute TodoQuery todoQuery,\n            BindingResult result,\n            @PageableDefault(page = 0, size = 5) Pageable pageable,\n            ModelAndView mv) {\n        mv.setViewName(\"todoList\");\n\n        if (todoService.isValid(todoQuery, result)) {\n            // エラーがなければ検索\n            //Page<Todo> todoPage = todoDao.findByCriteria(todoQuery, pageable);\n            //  ↓\n            Page<Todo> todoPage = todoService.searchWithNativeQuery(todoQuery, pageable);\n\n            // 入力された検索条件をsessionに保存\n            session.setAttribute(\"todoQuery\", todoQuery);\n\n            mv.addObject(\"todoPage\", todoPage);\n            mv.addObject(\"todoList\", todoPage.getContent());\n\n        } else {\n            // エラーがあった場合検索\n            mv.addObject(\"todoPage\", null);\n            mv.addObject(\"todoList\", null);\n        }\n\n        return mv;\n    }\n\n    //  ToDo一覧画面(todoList.html)でページリンクがクリックされたときの処理\n    @GetMapping(\"/todo/query2\")\n    public ModelAndView queryTodo(@PageableDefault(page = 0, size = 5) Pageable pageable,\n            ModelAndView mv) {\n        //現在のページ位置を保存\n        session.setAttribute(\"prevPageable\", pageable);\n        mv.setViewName(\"todoList\");\n\n        // sessionに保存されている条件で検索\n        TodoQuery todoQuery = (TodoQuery) session.getAttribute(\"todoQuery\");\n        //Page<Todo> todoPage = todoDao.findByCriteria(todoQuery, pageable); \n        //  ↓\n        Page<Todo> todoPage = todoService.searchWithNativeQuery(todoQuery, pageable);\n\n        mv.addObject(\"todoQuery\", todoQuery); // 検索条件表示用\n        mv.addObject(\"todoPage\", todoPage); // page情報\n        mv.addObject(\"todoList\", todoPage.getContent()); // 検索結果\n\n        return mv;\n    }\n\n    //  ToDo一覧画面(todoList.html)でTodoの件名がクリックされた時の処理\n    @GetMapping(\"/todo/{id}\")\n    public ModelAndView todoById(@PathVariable(name = \"id\") int id, ModelAndView mv) {\n        mv.setViewName(\"todoForm\");\n        Todo todo = todoRepository.findById(id).get();\n        mv.addObject(\"todoData\", todo);\n        session.setAttribute(\"mode\", \"update\");\n        return mv;\n    }\n\n    //  ToDo一覧画面(todoList.html)で[新規追加]ボタンがクリックされた時の処理\n    @GetMapping(\"/todo/create/form\")\n    public ModelAndView createTodo(ModelAndView mv) {\n        mv.setViewName(\"todoForm\");\n        mv.addObject(\"todoData\", new TodoData());\n        session.setAttribute(\"mode\", \"create\");\n        return mv;\n    }\n\n    //  ToDo入力画面(todoForm.html)で[登録]ボタンがクリックされた時の処理\n    @PostMapping(\"/todo/create/do\")\n    public ModelAndView createTodo(\n            @ModelAttribute @Validated TodoData todoData,\n            BindingResult result,\n            ModelAndView mv) {\n\n        // エラーチェック\n        boolean isValid = todoService.isValid(todoData, result, true);\n        if (!result.hasErrors() && isValid) {\n            // エラーなし\n            Todo todo = todoData.toEntity();\n            todoRepository.saveAndFlush(todo);\n            mv.setViewName(\"redirect:/todo\");\n\n        } else {\n            // エラーあり\n            mv.setViewName(\"todoForm\");\n            // mv.addObject(\"todoData\", todoData);\n        }\n        return mv;\n    }\n\n    //  ToDo入力画面(todoForm.html)で[更新]ボタンがクリックされた時の処理\n    @PostMapping(\"/todo/update\")\n    public String updateTodo(@ModelAttribute @Validated TodoData todoData,\n            BindingResult result,\n            Model model) {\n        // エラーチェック\n        boolean isValid = todoService.isValid(todoData, result, false);\n        if (!result.hasErrors() && isValid) {\n            // エラーなし\n            Todo todo = todoData.toEntity();\n            todoRepository.saveAndFlush(todo);\n            return \"redirect:/todo\";\n\n        } else {\n            // エラーあり\n            // model.addAttribute(\"todoData\", todoData);\n            return \"todoForm\";\n        }\n    }\n\n    //  ToDo入力画面(todoForm.html)で[削除]ボタンがク }, "diff": ""}, {"id": "todolist7x/src/main/java/com/example/todolist/dao/TodoDaoImpl.java", "dir": "java/com/example/todolist/dao", "sec": "main", "role": "DAO", "lang": "java", "main": false, "old": {"path": "todolist7x/src/main/java/com/example/todolist/dao/TodoDaoImpl.java", "name": "TodoDaoImpl.java", "text": "package com.example.todolist.dao;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport jakarta.persistence.EntityManager;\nimport jakarta.persistence.Query;\nimport jakarta.persistence.TypedQuery;\nimport jakarta.persistence.criteria.CriteriaBuilder;\nimport jakarta.persistence.criteria.CriteriaQuery;\nimport jakarta.persistence.criteria.Predicate;\nimport jakarta.persistence.criteria.Root;\n\nimport org.springframework.data.domain.Page;\nimport org.springframework.data.domain.PageImpl;\nimport org.springframework.data.domain.Pageable;\nimport org.springframework.stereotype.Repository;\n\nimport com.example.todolist.common.Utils;\nimport com.example.todolist.entity.Todo;\nimport com.example.todolist.entity.Todo_;\nimport com.example.todolist.form.TodoQuery;\n\nimport lombok.RequiredArgsConstructor;\n\n@Repository\n@RequiredArgsConstructor\npublic class TodoDaoImpl implements TodoDao {\n    private final EntityManager entityManager;\n\n    // JPQLによる検索\n    @Override\n    public List<Todo> findByJPQL(TodoQuery todoQuery) {\n        // ここを\"todo\"にすると実行時エラーになる。\n        StringBuilder sb = new StringBuilder(\"select t from Todo t where 1 = 1\");\n        List<Object> params = new ArrayList<>();\n        int pos = 0;\n\n        // 実行するJPQLの組み立て\n        // 件名\n        if (todoQuery.getTitle().length() > 0) {\n            sb.append(\" and t.title like ?\" + (++pos));\n            params.add(\"%\" + todoQuery.getTitle() + \"%\");\n        }\n\n        // 重要度\n        if (todoQuery.getImportance() != -1) {\n            sb.append(\" and t.importance = ?\" + (++pos));\n            params.add(todoQuery.getImportance());\n        }\n\n        // 緊急度\n        if (todoQuery.getUrgency() != -1) {\n            sb.append(\" and t.urgency = ?\" + (++pos));\n            params.add(todoQuery.getUrgency());\n        }\n\n        // 期限：開始～\n        if (!todoQuery.getDeadlineFrom().equals(\"\")) {\n            sb.append(\" and t.deadline >= ?\" + (++pos));\n            params.add(Utils.str2date(todoQuery.getDeadlineFrom()));\n        }\n\n        // ～期限：終了で検索\n        if (!todoQuery.getDeadlineTo().equals(\"\")) {\n            sb.append(\" and t.deadline <= ?\" + (++pos));\n            params.add(Utils.str2date(todoQuery.getDeadlineTo()));\n        }\n\n        // 完了\n        if (todoQuery.getDone() != null && todoQuery.getDone().equals(\"Y\")) {\n            sb.append(\" and t.done = ?\" + (++pos));\n            params.add(todoQuery.getDone());\n        }\n\n        // order\n        sb.append(\" order by t.id\");\n\n        Query query = entityManager.createQuery(sb.toString());\n        for (int i = 0; i < params.size(); ++i) {\n            query.setParameter(i + 1, params.get(i));\n        }\n\n        @SuppressWarnings(\"unchecked\")\n        List<Todo> list = query.getResultList();\n        return list;\n    }\n\n    // Criteria APIによる検索\n    @Override\n    public Page<Todo> findByCriteria(TodoQuery todoQuery, Pageable pageable) {\n        CriteriaBuilder builder = entityManager.getCriteriaBuilder();\n        CriteriaQuery<Todo> query = builder.createQuery(Todo.class);\n        Root<Todo> root = query.from(Todo.class);\n        List<Predicate> predicates = new ArrayList<>();\n\n        // 件名\n        if (todoQuery.getTitle().length() > 0) {\n            String title = \"%\" + todoQuery.getTitle() + \"%\";\n            predicates.add(builder.like(root.get(Todo_.title), title));\n        }\n\n        // 重要度\n        if (todoQuery.getImportance() != -1) {\n            predicates.add(\n                    builder.equal(\n                            root.get(Todo_.importance), todoQuery.getImportance()));\n        }\n\n        // 緊急度\n        if (todoQuery.getUrgency() != -1) {\n            predicates.add(\n                    builder.equal(\n                            root.get(Todo_.urgency), todoQuery.getUrgency()));\n        }\n\n        // 期限：開始～\n        if (!todoQuery.getDeadlineFrom().equals(\"\")) {\n            predicates.add(\n                    builder.greaterThanOrEqualTo(\n                            root.get(Todo_.deadline),\n                            Utils.str2date(todoQuery.getDeadlineFrom())));\n        }\n\n        // ～期限：終了で検索\n        if (!todoQuery.getDeadlineTo().equals(\"\")) {\n            predicates.add(\n                    builder.lessThanOrEqualTo(\n                            root.get(Todo_.deadline),\n                            Utils.str2date(todoQuery.getDeadlineTo())));\n        }\n\n        // 完了\n        if (todoQuery.getDone() != null && todoQuery.getDone().equals(\"Y\")) {\n            predicates.add(\n                    builder.equal(\n                            root.get(Todo_.done), todoQuery.getDone()));\n        }\n\n        // SELECT作成\n        Predicate[] predArray = new Predicate[predicates.size()];\n        predicates.toArray(predArray);\n        query.select(root).where(predArray).orderBy(builder.asc(root.get(Todo_.id)));\n\n        // クエリ生成\n        TypedQuery<Todo> typedQuery = entityManager.createQuery(query);\n        // 該当レコード数取得\n        int totalRows = typedQuery.getResultList().size();\n        // 先頭レコードの位置設定\n        typedQuery.setFirstResult(pageable.getPageNumber() * pageable.getPageSize());\n        // 1ページ当たりの件数\n        typedQuery.setMaxResults(pageable.getPageSize());\n\n        Page<Todo> page = new PageImpl<Todo>(typedQuery.getResultList(), pageable, totalRows);\n        return page;\n    }\n}"}, "new": {"path": "todolist8b/src/main/java/com/example/todolist/dao/TodoDaoImpl.java", "name": "TodoDaoImpl.java", "text": "package com.example.todolist.dao;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport jak ine),\n                            Utils.str2date(todoQuery.getDeadlineFrom())));\n        }\n\n        // ～期限：終了で検索\n        if (!todoQuery.getDeadlineTo().equals(\"\")) {\n            predicates.add(\n                    builder.lessThanOrEqualTo(\n                            root.get(Todo_.deadline),\n                            Utils.str2date(todoQuery.getDeadlineTo())));\n        }\n\n        // 完了\n        if (todoQuery.getDone() != null && todoQuery.getDone().equals(\"Y\")) {\n            predicates.add(\n                    builder.equal(\n                            root.get(Todo_.done), todoQuery.getDone()));\n        }\n\n        // SELECT作成\n        Predicate[] predArray = new Predicate[predicates.size()];\n        predicates.toArray(predArray);\n        query.select(root).where(predArray).orderBy(builder.asc(root.get(Todo_.id)));\n\n        // クエリ生成\n        TypedQuery<Todo> typedQuery = entityManager.createQuery(query);\n        // 該当レコード数取得\n        int totalRows = typedQuery.getResultList().size();\n        // 先頭レコードの位置設定\n        typedQuery.setFirstResult(pageable.getPageNumber() * pageable.getPageSize());\n        // 1ページ当たりの件数\n        typedQuery.setMaxResults(pageable.getPageSize());\n\n        Page<Todo> page = new PageImpl<Todo>(typedQuery.getResultList(), pageable, totalRows);\n        return page;\n    }\n}"}, "status": "same", "marks": {"old": {}, "new": {}}, "delAfter": [], "stat": {"add": 0, "chg": 0, "del": 0}, "diff": ""}, {"id": "todolist7x/src/main/java/com/example/todolist/entity/Todo.java", "dir": "java/com/example/todolist/entity", "sec": "main", "role": "Entity", "lang": "java", "main": false, "old": {"path": "todolist7x/src/main/java/com/example/todolist/entity/Todo.java", "name": "Todo.java", "text": "package com.example.todolist.entity;\n\nimport java.time.LocalDate;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\ni able;\nimport org.springframework.stereotype.Service;\nimport org.springframework.validation.BindingResult;\nimport org.springframework.validation.FieldError;\n\nimport com.example.todolist.common.Utils;\nimport com.example.todolist.entity.Todo;\nimport com.example.todolist.form.TodoData;\nimport com.example.todolist.form.TodoQuery;\nimport com.example.todolist.repository.TodoRepository;\n\nimport lombok.AllArgsConstructor;\n\n@Service\n@AllArgsConstructor\npublic class TodoService {\n    private final TodoRepository todoRepository;\n\n    /**\n     * ToDoの入力内容を検証する。\n     * <p>\n     * 以下のチェックを行い、違反があれば{@code result}に{@link FieldError}を追加する。\n     * <ul>\n     *   <li>件名が全角スペースだけで構成されていないこと<\/li>\n     *   <li>期限が過去日付でないこと（{@code isCreate}が{@code true}の新規登録時のみチェック）<\/li>\n     *   <li>期限がyyyy-MM-dd形式で入力されていること<\/li>\n     * <\/ul>\n     *\n     * @param todoData 検証対象のToDo入力データ\n     * @param result   検証エラーを格納するバインディング結果\n     * @param isCreate 新規登録の場合は{@code true}、更新の場合は{@code false}\n     *                 （過去日付チェックは新規登録時のみ行う）\n     * @return すべての検証を満たす場合は{@code true}、いずれかに違反する場合は{@code false}\n     */\n    public boolean isValid(TodoData todoData, BindingResult result, boolean isCreate) {\n        boolean ans = true;\n\n        // 件名が全角スペースだけで構成されていたらエラー\n        if (!Utils.isBlank(todoData.getTitle())) {\n            if (Utils.isAllDoubleSpace(todoData.getTitle())) {\n                FieldError fieldError = new FieldError(\n                        result.getObjectName(),\n                        \"title\",\n                        \"件名が全角スペースです\");\n                result.addError(fieldError);\n                ans = false;\n            }\n        }\n\n        // 期限が\"\"ならチェックしない\n        String deadline = todoData.getDeadline();\n        if (!deadline.equals(\"\")) {\n            // yyyy-MM-dd形式チェック\n            if (!Utils.isValidDateFormat(deadline)) {\n                FieldError fieldError = new FieldError(\n                        result.getObjectName(),\n                        \"deadline\",\n                        \"期限を設定するときはyyyy-mm-dd形式で入力してください\");\n                result.addError(fieldError);\n                ans = false;\n\n            } else {\n                // 過去日付チェックは新規登録の場合のみ\n                if (isCreate) {\n                    // 過去日付ならエラー\n                    if (!Utils.isTodayOrFutureDate(deadline)) {\n                        FieldError fieldError = new FieldError(\n                                result.getObjectName(),\n                                \"deadline\",\n                                \"期限を設定するときは今日以降にしてください\");\n                        result.addError(fieldError);\n                        ans = false;\n                    }\n                }\n            }\n        }\n\n        return ans;\n    }\n\n    /**\n     * ToDo検索条件の入力内容を検証する。\n     * <p>\n     * 以下のチェックを行い、違反があれば{@code result}に{@link FieldError}を追加する。\n     * <ul>\n     *   <li>期限：開始がyyyy-MM-dd形式で入力されていること<\/li>\n     *   <li>期限：終了がyyyy-MM-dd形式で入力されていること<\/li>\n     * <\/ul>\n     *\n     * @param todoQuery 検証対象のToDo検索条件\n     * @param result    検証エラーを格納するバインディング結果\n     * @return すべての検証を満たす場合は{@code true}、いずれかに違反する場合は{@code false}\n     */\n    public boolean isValid(TodoQuery todoQuery, BindingResult result) {\n        boolean ans = true;\n\n        // 期限:開始の形式をチェック\n        String date = todoQuery.getDeadlineFrom();\n        if (!date.equals(\"\") && !Utils.isValidDateFormat(date)) {\n            FieldError fieldError = new FieldError(\n                    result.getObjectName(),\n                    \"deadlineFrom\",\n                    \"期限：開始を入力するときはyyyy-mm-dd形式で入力してください\");\n            result.addError(fieldError);\n            ans = false;\n        }\n\n        // 期限:終了の形式をチェック\n        date = todoQuery.getDeadlineTo();\n        if (!date.equals(\"\") && !Utils.isValidDateFormat(date)) {\n            FieldError fieldError = new FieldError(\n                    result.getObjectName(),\n                    \"deadlineTo\",\n                    \"期限：終了を入力するときはyyyy-mm-dd形式で入力してください\");\n            result.addError(fieldError);\n            ans = false;\n        }\n        return ans;\n\n    }\n\n    /**\n     * 検索条件に応じてToDoを検索する。\n     * <p>\n     * 入力された検索条件を先頭から順に評価し、最初に該当した条件で検索を行う。\n     * <ul>\n     *   <li>タイトル（部分一致）<\/li>\n     *   <li>重要度<\/li>\n     *   <li>緊急度<\/li>\n     *   <li>期限：開始のみ（開始日以降）<\/li>\n     *   <li>期限：終了のみ（終了日以前）<\/li>\n     *   <li>期限：開始～終了（範囲）<\/li>\n     *   <li>完了状態<\/li>\n     * <\/ul>\n     * いずれの条件も指定されていない場合は全件を検索する。\n     *\n     * @param todoQuery 検索条件\n     * @return 検索条件に一致するToDoのリスト\n     */\n    public List<Todo> doQuery(TodoQuery todoQuery) {\n        List<Todo> todoList = null;\n        if (todoQuery.getTitle().length() > 0) {\n            // タイトルで検索\n            todoList = todoRepository.findByTitleLike(\"%\" + todoQuery.getTitle() + \"%\");\n\n        } else if (todoQuery.getImportance() != null && todoQuery.getImportance() != -1) {\n            // 重要度で検索\n            todoList = todoRepository.findByImportance(todoQuery.getImportance());\n\n        } else if (todoQuery.getUrgency() != null && todoQuery.getUrgency() != -1) {\n            // 緊急度で検索\n            todoList = todoRepository.findByUrgency(todoQuery.getUrgency());\n\n        } else if (!todoQuery.getDeadlineFrom().equals(\"\") &&\n                todoQuery.getDeadlineTo().equals(\"\")) {\n            // 期限 開始～\n            todoList = todoRepository\n                    .findByDeadlineGreaterThanEqualOrderByDeadlineAsc(\n                            Utils.str2date(todoQuery.getDeadlineFrom()));\n\n        } else if (todoQuery.getDeadlineFrom().equals(\"\") &&\n                !todoQuery.getDeadlineTo().equals(\"\")) {\n            // 期限 ～終了\n            todoList = todoRepository\n                    .findByDeadlineLessThanEqualOrderByDeadlineAsc(\n                            Utils.str2date(todoQuery.getDeadlineTo()));\n\n        } else if (!todoQuery.getDeadlineFrom().equals(\"\") & "HISTORY.md", "text": "# HISTORY.md (springlearn2)\n\n学習の履歴ログ。演習アプリの進捗、つまずいたポイント・Q&A、次にやりたいことを都度追記していく。\n方針は`CLAUDE.md`を参照。\n\n## 演習アプリ別ログ\n\n### todolist7x(ToDoアプリ、参考書のサンプル)\n\n- 2026-11-16: 参考書のサンプル(`sampleSource/`)を`todolist7x/`にコピーしてプロジェクト作成。ビルド・起動(`GET /todo`)・DB接続(`tododb`)を確認済み\n- 構成: `controller/TodoListController` → `service/TodoService` → `repository/TodoRepository`(JpaRepository) / `dao/TodoDaoImpl`(EntityManager で条件検索+ページング)。`form/TodoData`(入力フォーム)、`form/TodoQuery`(検索条件)、`entity/Todo`、`common/Utils`\n- 前シーズンの todolist_ver1 との違い(ざっと見た範囲): Spring Boot 4.0.1 / Java 21、`@RequiredArgsConstructor`でのコンストラクタインジェクション、`hibernate-processor`(JPAメタモデル生成)の追加\n- 2026-11-24: 参考書の7章版として `参考ソース/back/todolist7x/` に移動(読み取り専用。ソースノートの「元」)\n\n### todolist8b(参考書8章のサンプル。テーマ: 多言語対応 i18n)\n\n- 2026-11-24: 参考書の8章サンプル(`参考ソース/Todolist8b/`、Eclipse形式)から src・sql・Gradle設定を `todolist8b/` にコピーして、VSCodeで動く形にした。`gradlew build`(テスト含む)と起動を確認済み。ブラウザの言語が日本語なら日本語、英語なら英語で画面が出ることも確認した\n- ソースノートに反映(元 = todolist7x / 改修後 = todolist8b を切り替えて表示、差分に色付け)\n\n#### 7章 → 8章の変更ファイル(2026-11-24反映。空白・インデントだけの違いは除く)\n\n| ファイル | 区分 | 変更の狙い(コードから読み取れる範囲) |\n|---|---|---|\n| `application.properties(.example)` | 変更 | `spring.messages.basename` でメッセージファイル(`i18n/FixedDisplayStrings`、`i18n/ValidationMessages`)を読み込む。`fallback-to-system-locale=false` で、該当言語が無いときはOSの言語ではなく既定ファイルを使う |\n| `i18n/FixedDisplayStrings(_en/_ja).properties` | 追加 | 画面の固定文言(見出し・ボタン・選択肢・ページ送り)を言語別のファイルに外出し。`_ja` は `件名` のようなUnicodeエスケープで書かれている。既定ファイルは `Title(default)` となっていて、どのファイルが使われたか見分けられる |\n| `i18n/ValidationMessages(_en/_ja).properties` | 追加 | 入力チェックのエラーメッセージを言語別に。キーは `NotBlank.todoData.title`(アノテーション名.オブジェクト名.フィールド名)形式と、独自チェック用(`DoubleSpace...`、`InvalidFormat...`、`Past...`) |\n| `form/TodoData.java` | 変更 | `@NotBlank(message = \"…\")` などから `message` を削除。メッセージはファイルから自動で引かれる |\n| `service/TodoService.java` | 変更 | `MessageSource` を注入し、独自チェックのエラー文を `messageSource.getMessage(キー, null, locale)` で取得。2つの `isValid` に `Locale` 引数を追加 |\n| `controller/TodoListController.java` | 変更 | 検索・登録・更新の各メソッドに引数 `Locale locale` を追加して `isValid` に渡す。(インデントがスペース→タブに変わっているが、差分からは除外) |\n| `templates/todoForm.html` | 変更 | 固定文言を `th:text=\"#{label.title}\"` などに置き換え。各項目にHTMLコメントを追加 |\n| `templates/todoList.html` | 変更 | 固定文言を `#{…}` に置き換え。ページ表示は `#{text.paging(現在, 全体)}` で引数つき。完了表示は `'__#{text.done}__'`(先行評価)。HTMLコメントを追加 |\n| `settings.gradle` / `Todolist8bApplication.java` / テスト | 変更 | プロジェクト名・クラス名を 7x → 8b に変えただけ |\n\nその他の小さな変更(2026-11-24 本人に確認済み):\n- `todoList.html` 先頭の `${#locale.language}=<span th:text=\"${#locale.language}\">` … 今の言語を画面に出す**動作確認用**\n- `todoList.html` で `<hr>` が `<\/form>` の内側から外側に移動 … **特に狙いはない**(見た目もほぼ変わらない)\n\n---\n\n## つまずきポイント・Q&Aログ\n\n(まだなし)\n\n---\n\n## 次にやりたいこと\n\n1. ソースノートで 7章 → 8章(i18n)の差分を読む。特に `MessageSource` と `Locale` がどこから来るか、`#{…}` の仕組み\n2. `todolist8b` を起動し、ブラウザの言語設定を英語にして表示とエラーメッセージが切り替わるのを確かめる\n3. 参考書の章に沿って、ソースを読み・写経する"}, "new": {"path": "HISTORY.md", "name": "HISTORY.md", "text": "# HISTORY.md (springlearn2)\n\n学習の履歴ログ。演習アプリの進捗、つまずいたポイント・Q&A、次にやりたいことを都度追記していく。\n方針は`CLAUDE.md`を参照。\n\n## 演習アプリ別ログ\n\n### todolist7x(ToDoアプリ、参考書のサンプル)\n\n- 2026-11-16: 参考書のサンプル(`sampleSource/`)を`todolist7x/`にコピーしてプロジェクト作成。ビルド・起動(`GET /todo`)・DB接続(`tododb`)を確認済み\n- 構成: `controller/TodoListController` → `service/TodoService` → `repository/TodoRepository`(JpaRepository) / `dao/TodoDaoImpl`(EntityManager で条件検索+ページング)。`form/TodoData`(入力フォーム)、`form/TodoQuery`(検索条件)、`entity/Todo`、`common/Utils`\n- 前シーズンの todolist_ver1 との違い(ざっと見た範囲): Spring Boot 4.0.1 / Java 21、`@RequiredArgsConstructor`でのコンストラクタインジェクション、`hibernate-processor`(JPAメタモデル生成)の追加\n- 2026-11-24: 参考書の7章版として `参考ソース/back/todolist7x/` に移動(読み取り専用。ソースノートの「元」)\n\n### todolist8b(参考書8章のサンプル。テーマ: 多言語対応 i18n)\n\n- 2026-11-24: 参考書の8章サンプル(`参考ソース/Todolist8b/`、Eclipse形式)から src・sql・Gradle設定を `todolist8b/` にコピーして、VSCodeで動く形にした。`gradlew build`(テスト含む)と起動を確認済み。ブラウザの言語が日本語なら日本語、英語なら英語で画面が出ることも確認した\n- ソースノートに反映(元 = todolist7x / 改修後 = todolist8b を切り替えて表示、差分に色付け)\n\n#### 7章 → 8章の変更ファイル(2026- const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const files = DATA.files;
const V = DATA.versions;  // {old: {label, desc}, new: {label, desc}}
// f.id は質問ログに残る識別子(元にあるファイルは「todolist7x/...」で、以前のノートと同じ)
const byPath = Object.fromEntries(files.map(f => [f.id, f]));
let ver = store.get('ver') === 'old' ? 'old' : 'new';   // 表示中の版
let cur = byPath[store.get('file')] || files.find(f => f.main) || files[0];
let sel = null;          // {from, to} 1始まり
let thread = null;       // 現在の会話 {id, file, ver, lines, turns:[{q,a}]}
let sample = null, db = null, ctl = null;
let onlyChanged = store.get('onlyChanged') === '1';
const STATUS = { mod: '変更', add: '追加', del: '削除', same: '変更なし' };
const side = (f, v = ver) => f[v];                 // その版のファイル {path, name, text}(無ければ null)
const anySide = f => f[ver] || f.old || f.new;     // 表示用(その版に無ければもう一方)
const verLabel = v => `${V[v].label}(${V[v].desc})`;

$('built').textContent = '生成 ' + DATA.built;

/* ---------- 元 / 改修後 の切り替え ---------- */
$('verOld').textContent = V.old.label;
$('verNew').textContent = V.new.label;
$('verOld').title = V.old.desc;
$('verNew').title = V.new.desc;
function setVer(v) {
  ver = v;
  store.set('ver', v);
  $('verOld').setAttribute('aria-pressed', String(v === 'old'));
  $('verNew').setAttribute('aria-pressed', String(v === 'new'));
}
setVer(ver);
$('verOld').onclick = () => { if (!ctl && ver !== 'old') { setVer('old'); open(cur); } };
$('verNew').onclick = () => { if (!ctl && ver !== 'new') { setVer('new'); open(cur); } };

/* ---------- タブ ---------- */
function show(tab) {
  for (const [t, v] of [['tabCode', 'viewCode'], ['tabFiles', 'viewFiles'], ['tabLog', 'viewLog']]) {
    $(t).setAttribute('aria-selected', String(t === tab));
    $(v).hidden = t !== tab;
  }
  $('picker').hidden = tab !== 'tabCode';
  $('askbar').hidden = tab !== 'tabCode';
  window.scrollTo(0, 0);
}
$('tabCode').onclick = () => show('tabCode');
$('tabFiles').onclick = () => { show('tabFiles'); renderTree(); };
$('tabLog').onclick = () => show('tabLog');
$('fileBtn').onclick = () => { show('tabFiles'); renderTree(); };

/* ---------- ファイル一覧 ---------- */
function renderSummary() {
  const n = { mod: 0, add: 0, del: 0, same: 0 };
  for (const f of files) if (!f.doc) n[f.status]++;
  $('summary').innerHTML = `<div><b>${esc(V.old.label)}</b>(${esc(V.old.desc)})→ <b>${esc(V.new.label)}</b>(${esc(V.new.desc)})の比較</div>
    <div class="counts"><span class="badge mod">変更</span>${n.mod} <span class="badge add">追加</span>${n.add} <span class="badge del">削除</span>${n.del} <span>変更なし ${n.same}</span></div>
    <label><input type="checkbox" id="onlyChanged"${onlyChanged ? ' checked' : ''}> 変更のあるファイルだけ表示</label>
    <div style="color: var(--muted); font-size: 12px">空白(インデント)だけの違いは差分に含めていません。</div>`;
  $('onlyChanged').onchange = e => { onlyChanged = e.target.checked; store.set('onlyChanged', onlyChanged ? '1' : '0'); renderTree(); };
}
function renderTree() {
  const q = $('q').value.trim().toLowerCase();
  const groups = new Map();
  for (const f of files) {
    if (onlyChanged && f.status === 'same') continue;
    const s = anySide(f);
    let hit = '';
    if (q) {
      if (!s.path.toLowerCase().includes(q)) {
        const i = s.text.toLowerCase().indexOf(q);
        if (i < 0) continue;
        const ls = s.text.lastIndexOf('\n', i) + 1, le = s.text.indexOf('\n', i);
        const lineNo = s.text.slice(0, i).split('\n').length;
        const line = s.text.slice(ls, le < 0 ? undefined : le).trim();
        const j = line.toLowerCase().indexOf(q);
        hit = `${lineNo}: ` + esc(line.slice(0, j)) + '<mark>' + esc(line.slice(j, j + q.length)) + '</mark>' + esc(line.slice(j + q.length));
      }
    }
    const key = (f.sec || 'other') + '|' + f.dir;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ f, hit });
  }
  const tree = $('tree');
  tree.innerHTML = groups.size ? '' : '<p class="empty">見つかりませんでした。</p>';
  // src/main 配下(アプリ本体)とそれ以外(ビルド設定など)を大見出しで分ける
  const SEC = { main: ['アプリ本体', 'src/main 配下'], other: ['ビルド設定・SQL・テストなど', 'src/main 以外'] };
  const secBox = {};
  for (const [key, list] of groups) {
    const [sec, dir] = key.split('|');
    if (!secBox[sec]) {
      secBox[sec] = document.createElement('div');
      secBox[sec].className = 'sec';
      const [title, sub] = SEC[sec] || SEC.other;
      secBox[sec].innerHTML = `<h3>${esc(title)}<small>${esc(sub)}</small></h3>`;
      tree.appendChild(secBox[sec]);
    }
    const div = document.createElement('div');
    div.className = 'dir';
    div.innerHTML = `<h2>${esc(dir || '(ルート)')}</h2><ul></ul>`;
    for (const { f, hit } of list) {
      const li = document.createElement('li');
      const badge = f.status !== 'same' ? `<span class="badge ${f.status}">${STATUS[f.status]}</span>` : '';
      li.innerHTML = `<button aria-current="${f === cur}"><span class="name">${esc(anySide(f).name)}</span>${badge}<span class="role">${esc(f.role || '')}</span></button>` + (hit ? `<div class="hit">${hit}</div>` : '');
      li.querySelector('button').onclick = () => { open(f); show('tabCode'); };
      div.querySelector('ul').appendChild(li);
    }
    secBox[sec].appendChild(div);
  }
}
$('q').addEventListener('input', renderTree);

/* ---------- コード表示 ---------- */
function highlight(text, lang) {
  try {
    if (window.hljs && lang && hljs.getLanguage(lang)) return hljs.highlight(text, { language: lang, ignoreIllegals: true }).value;
  } catch (e) {}
  return esc(text);
}
// ハイライト後の HTML を行ごとに分ける(行をまたぐ span を閉じて次の行で開き直す)
function splitLines(html) {
  const out = [];
  let open = [], line = '';
  const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+|<)/g;
  let m;
  while ((m = re.exec(html))) {
    if (m[1]) { open.push(m[1]); line += m[1]; }
    else if (m[2]) { open.pop(); line += m[2]; }
    else if (m[3]) { out.push(line + '</span>'.repeat(open.length)); line = open.join(''); }
    else line += m[4];
  }
  out.push(line + '</span>'.repeat(open.length));
  return out;
}
function renderLegend(f, s) {
  const lg = $('legend');
  const other = ver === 'old' ? 'new' : 'old';
  if (!s) {
    // 表示中の版にこのファイルが無い(追加されたファイルを元で見た / 削除されたファイルを改修後で見た)
    const msg = f.status === 'add' ? `このファイルは${V.new.label}(${V.new.desc})で新しく追加されたファイルです。${V.old.label}にはありません。`
      : `このファイルは${V.new.label}(${V.new.desc})では削除されています。`;
    lg.innerHTML = `<div class="absent"><span>${esc(msg)}</span><button class="btn ghost" id="toOther">${esc(V[other].label)}で見る</button></div>`;
    $('toOther').onclick = () => { setVer(other); open(f); };
    return;
  }
  const st = f.stat, sw = (c, t) => `<span><span class="sw ${c}"></span>${esc(t)}</span>`;
  let h = '';
  if (f.doc) h = '';
  else if (f.status === 'same') h = `<span>${esc(V.old.label)}と${esc(V.new.label)}で同じ(変更なし)</span>`;
  else if (f.status === 'add') h = sw('add', `${V.new.label}で新しく追加されたファイル(全${st.add}行)`);
  else if (f.status === 'del') h = sw('del', `${V.new.label}では削除されたファイル(全${st.del}行)`);
  else if (ver === 'new') {
    h = (st.add ? sw('add', `追加 ${st.add}行`) : '') + (st.chg ? sw('chg', `変更 ${st.chg}行`) : '')
      + (st.del ? `<span><span class="dash"></span>ここで${esc(V.old.label)}の行を削除(${st.del}行。${esc(V.old.label)}で表示)</span>` : '');
  } else {
    const oc = Object.values(f.marks.old).filter(x => x === 'chg').length;
    h = (oc ? sw('chg', `変更前 ${oc}行`) : '') + (st.del ? sw('del', `削除 ${st.del}行`) : '')
      + (st.add ? `<span>追加 ${st.add}行は${esc(V.new.label)}で表示</span>` : '');
  }
  if (f.status !== 'same') h += '<button id="nextChg">次の変更 ↓</button>';
  lg.innerHTML = h;
  lg.hidden = !h;
  if ($('nextChg')) $('nextChg').onclick = nextChange;
}
const isMarked = tr => tr && (tr.classList.contains('add') || tr.classList.contains('chg') || tr.classList.contains('del'));
let lastJump = null;
function nextChange() {
  const rows = [...$('code').querySelectorAll('tr')];
  // 変更のかたまりの先頭行と、削除位置の印がある行
  const starts = rows.filter((tr, i) => (isMarked(tr) && !isMarked(rows[i - 1])) || tr.classList.contains('delbelow') || tr.classList.contains('delabove'));
  if (!starts.length) return;
  const mid = window.innerHeight / 2 + 10;
  let next = starts.find(tr => tr.getBoundingClientRect().top > mid) || starts[0];
  if (next === lastJump) next = starts[(starts.indexOf(next) + 1) % starts.length];  // ページ末尾で中央まで動かせないとき
  lastJump = next;
  next.scrollIntoView({ block: 'center' });
}
function open(f) {
  cur = f; sel = null; thread = null; lastJump = null;
  store.set('file', f.id);
  const s = side(f), a = anySide(f);
  $('curPath').textContent = a.path;
  $('curName').textContent = a.name;
  $('legend').hidden = false;
  renderLegend(f, s);
  $('thread').innerHTML = '';
  if (!s) {
    $('curSub').textContent = (f.role ? f.role + ' / ' : '') + V[ver].label + 'には無いファイル';
    $('code').hidden = true;
    $('code').innerHTML = '';
    renderCtx();
    return;
  }
  $('code').hidden = false;
  $('curSub').textContent = (f.role ? f.role + ' / ' : '') + s.text.split('\n').length + '行 / ' + V[ver].label;
  const marks = f.marks[ver] || {};
  const delAt = new Set(ver === 'new' ? f.delAfter : []);
  const rows = splitLines(highlight(s.text, f.lang));
  $('code').innerHTML = '<table><tbody>' + rows.map((h, i) => {
    const n = i + 1;
    const cls = [marks[n] || '', delAt.has(n) ? 'delbelow' : '', n === 1 && delAt.has(0) ? 'delabove' : ''].filter(Boolean).join(' ');
    return `<tr data-n="${n}"${cls ? ` class="${cls}"` : ''}><td class="ln">${n}</td><td class="src">${h || ' '}</td></tr>`;
  }).join('') + '</tbody></table>';
  renderCtx();
}
$('code').addEventListener('click', e => {
  const ln = e.target.closest('.ln');
  if (!ln) return;
  const n = +ln.parentElement.dataset.n;
  if (!sel) sel = { from: n, to: n };
  else if (sel.from === sel.to && n !== sel.from) sel = { from: Math.min(sel.from, n), to: Math.max(sel.from, n) };
  else if (n >= sel.from && n <= sel.to) sel = null;
  else sel = { from: n, to: n };
  for (const tr of $('code').querySelectorAll('tr')) {
    const k = +tr.dataset.n;
    tr.classList.toggle('on', !!sel && k >= sel.from && k <= sel.to);
  }
  renderCtx();
});
function linesLabel(s) { return s ? (s.from === s.to ? `${s.from}行目` : `${s.from}〜${s.to}行目`) : 'ファイル全体'; }
function renderCtx() {
  const c = $('ctx');
  if (!side(cur)) {
    c.innerHTML = `このファイルは${esc(V[ver].label)}に無いため、質問するときは版を切り替えてください。`;
  } else if (thread && thread.turns.length) {
    c.innerHTML = `続けて質問: <b>${esc(thread.file.split('/').pop())}</b>(${esc(V[thread.ver].label)}) ${esc(linesLabel(thread.lines))}`;
    const b = document.createElement('button');
    b.textContent = '新しい質問にする';
    b.onclick = () => { thread = null; $('thread').innerHTML = ''; renderCtx(); };
    c.appendChild(b);
  } else {
    c.innerHTML = `対象: <b>${esc(side(cur).name)}</b>(${esc(V[ver].label)}) ${esc(linesLabel(sel))}`;
  }
}

/* ---------- Markdown(回答表示用の最小限) ---------- */
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function md(src) {
  const lines = src.split('\n');
  let html = '', i = 0, list = null, para = [];
  const flush = () => {
    if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; }
    if (list) { html += `</${list}>`; list = null; }
  };
  while (i < lines.length) {
    const l = lines[i];
    const fence = l.match(/^```\s*(\w*)/);
    if (fence) {
      flush();
      const body = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) body.push(lines[i++]);
      i++;
      html += `<pre><code>${highlight(body.join('\n'), fence[1] === 'html' ? 'xml' : fence[1])}</code></pre>`;
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    const ul = l.match(/^\s*[-*]\s+(.*)/);
    const ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { flush(); html += `<h4>${inline(h[2])}</h4>`; }
    else if (ul || ol) {
      if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; }
      const want = ul ? 'ul' : 'ol';
      if (list !== want) { if (list) html += `</${list}>`; html += `<${want}>`; list = want; }
      html += `<li>${inline((ul || ol)[1])}</li>`;
    }
    else if (!l.trim()) flush();
    else { if (list) { html += `</${list}>`; list = null; } para.push(l); }
    i++;
  }
  flush();
  return html;
}

/* ---------- 質問 ---------- */
function numbered(text, s) {
  const ls = text.split('\n');
  const from = s ? s.from : 1, to = s ? s.to : ls.length;
  return ls.slice(from - 1, to).map((l, k) => `${from + k}: ${l}`).join('\n');
}
// 質問に渡すコードは、その会話の版(t.ver)に合わせる
function buildPrompt(t, question) {
  const f = byPath[t.file] || cur;
  const v = t.ver || 'old';
  const s = f[v] || anySide(f);
  const others = files.filter(x => x !== f && x[v]).map(x => `### ${x[v].path}\n${x[v].text}`).join('\n\n');
  const changed = files.filter(x => x.status !== 'same').map(x => `- ${(x.new || x.old).path}(${STATUS[x.status]})`).join('\n');
  const fileDiff = f.status === 'mod' ? f.diff
    : f.status === 'add' ? `このファイルは${V.new.label}で新しく追加された(${V.old.label}には無い)`
    : f.status === 'del' ? `このファイルは${V.new.label}で削除された` : '変更なし';
  const rules = `${DATA.guide}

# 今回の質問の対象
表示中の版: ${verLabel(v)}
ファイル: ${s.path}
範囲: ${linesLabel(t.lines)}
${t.lines ? '\n## 選択された行\n' + numbered(s.text, t.lines) + '\n' : ''}
## 対象ファイル全体(行番号つき)
${numbered(s.text, null)}

## このファイルの元からの差分(${verLabel('old')} → ${verLabel('new')}。空白だけの違いは除く)
${fileDiff}

# 元と改修後で変わったファイルの一覧
${changed}

# 参考: 同じ版(${V[v].label})の他のファイル
${others}`;
  const turns = [{ role: 'user', content: rules + '\n\n# 質問\n' + (t.turns[0] ? t.turns[0].q : question) }];
  t.turns.forEach((x, k) => {
    if (k > 0) turns.push({ role: 'user', content: x.q });
    if (x.a) turns.push({ role: 'assistant', content: x.a });
  });
  if (t.turns.length) turns.push({ role: 'user', content: question });
  return turns;
}
function renderThread(el, t, pendingQ, pendingA) {
  let h = '';
  for (const x of t.turns) {
    h += `<div class="turn q"><div class="who">質問</div><div class="q-text">${esc(x.q)}</div></div>`;
    h += `<div class="turn"><div class="who">Claude</div><div class="md">${md(x.a)}</div></div>`;
  }
  if (pendingQ != null) {
    h += `<div class="turn q"><div class="who">質問</div><div class="q-text">${esc(pendingQ)}</div></div>`;
    h += `<div class="turn"><div class="who">Claude</div><div class="md">${pendingA ? md(pendingA) : '<span class="thinking">考え中…(数十秒かかることがあります)</span>'}</div></div>`;
  }
  el.innerHTML = h;
}
const ERR = {
  not_granted: 'Claude への質問が許可されていません。',
  rate_limited: '質問が続いたため一時的に止められました。少し待ってからもう一度送ってください。',
  cancelled: '止めました。',
};
async function ask() {
  const q = $('askText').value.trim();
  if (!q || !sample || !side(cur)) return;
  if (!thread) thread = { id: null, file: cur.id, ver, lines: sel, turns: [] };
  const t = thread;
  const input = buildPrompt(t, q);
  $('askText').value = ''; autosize();
  $('askBtn').textContent = '停止';
  ctl = new AbortController();
  const el = $('thread');
  renderThread(el, t, q, '');
  el.lastElementChild.scrollIntoView({ block: 'nearest' });
  try {
    const { text } = await sample(input, { signal: ctl.signal, cache: false, onText: ({ text }) => renderThread(el, t, q, text) });
    t.turns.push({ q, a: text });
    renderThread(el, t);
    saveThread(t);
  } catch (e) {
    renderThread(el, t, q, e.text || '');
    el.insertAdjacentHTML('beforeend', `<p class="err">${esc(ERR[e.code] || 'うまく回答を受け取れませんでした。もう一度送ってください。')}</p>`);
    if (e.text) { t.turns.push({ q, a: e.text + '\n\n(途中で止まりました)' }); saveThread(t); }
    if (e.code === 'not_granted') disableAsk();
  } finally {
    ctl = null;
    $('askBtn').textContent = '質問';
    renderCtx();
  }
}
$('askBtn').onclick = () => { if (ctl) ctl.abort(); else ask(); };
function autosize() { const a = $('askText'); a.style.height = 'auto'; a.style.height = Math.min(a.scrollHeight, window.innerHeight * 0.3) + 'px'; }
$('askText').addEventListener('input', autosize);
function disableAsk() {
  $('askrow').hidden = true;
  $('noask').hidden = false;
  $('noask').textContent = 'ここでは Claude に質問できません。claude.ai のアプリでこのページを開くと質問できます。';
}

/* ---------- 質問ログ(db) ---------- */
let logDocs = [];
async function saveThread(t) {
  if (!db) return;
  const body = { file: t.file, ver: t.ver, lines: t.lines, turns: t.turns, updated: Date.now() };
  try {
    if (t.id) await db.collection('qa').doc(t.id).set({ ...body, created: t.created });
    else { t.created = Date.now(); const ref = await db.collection('qa').add({ ...body, created: t.created }); t.id = ref.id; }
  } catch (e) {
    $('thread').insertAdjacentHTML('beforeend', '<p class="err">質問ログに保存できませんでした(回答はこの画面には残っています)。</p>');
  }
}
function fmt(ms) { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }
function renderLog() {
  const log = $('log');
  $('logN').textContent = logDocs.length ? `(${logDocs.length})` : '';
  if (!logDocs.length) { log.innerHTML = '<p class="empty">まだ質問はありません。コード画面の下の欄から質問すると、ここに残ります。</p>'; return; }
  log.innerHTML = '';
  for (const d of logDocs) {
    const x = d.data();
    const det = document.createElement('details');
    det.className = 'entry';
    // ver が無い質問は、比較機能を入れる前(元 todolist7x だけだった頃)のもの
    const xv = x.ver === 'new' ? 'new' : 'old';
    det.innerHTML = `<summary><span class="meta">${esc(fmt(x.updated || x.created))} ・ ${esc(V[xv].label)} ・ ${esc(x.file)} ${esc(linesLabel(x.lines))}</span><span class="first">${esc(x.turns && x.turns[0] ? x.turns[0].q : '')}</span></summary><div class="body"><div class="thread"></div><div class="acts"><button class="btn ghost">このコードを開いて続けて質問</button></div></div>`;
    det.addEventListener('toggle', () => { if (det.open) renderThread(det.querySelector('.thread'), x); }, { once: true });
    det.querySelector('.btn').onclick = () => {
      const f = byPath[x.file];
      if (!f || ctl) return;
      setVer(xv);
      open(f);
      if (x.lines) $('code').querySelectorAll('tr').forEach(tr => { const k = +tr.dataset.n; tr.classList.toggle('on', k >= x.lines.from && k <= x.lines.to); });
      sel = x.lines || null;
      thread = { id: d.id, created: x.created, file: x.file, ver: xv, lines: x.lines || null, turns: x.turns.slice() };
      renderThread($('thread'), thread);
      renderCtx();
      show('tabCode');
    };
    log.appendChild(det);
  }
}

/* ---------- 起動 ---------- */
renderSummary();
open(cur);
renderLog();
$('log').innerHTML = '<p class="empty">質問ログを読み込み中…</p>';
(async () => {
  if (!window.claude) { disableAsk(); $('log').innerHTML = '<p class="empty">質問ログは claude.ai 上で開いたときに表示されます。</p>'; return; }
  claude.use('sample').then(s => { sample = s; if (!s) disableAsk(); });
  db = await claude.use('db');
  if (!db) { $('log').innerHTML = '<p class="empty">質問ログは claude.ai にサインインして開いたときに表示されます。</p>'; return; }
  const timer = setTimeout(() => { if (!logDocs.length) $('log').innerHTML = '<p class="empty">質問ログにまだ接続できません。電波の良い場所で開き直してください。</p>'; }, 10000);
  db.collection('qa').orderBy('updated', 'desc').limit(300).onSnapshot(snap => {
    if (!snap.fromCache) clearTimeout(timer);
    logDocs = snap.docs;
    renderLog();
  }, () => { clearTimeout(timer); $('log').innerHTML = '<p class="empty">質問ログを読み込めませんでした。</p>'; });
})();
</script>
